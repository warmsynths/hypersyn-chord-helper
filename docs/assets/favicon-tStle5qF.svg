<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#14131d" />
      <stop offset="60%" stop-color="#09080e" />
      <stop offset="100%" stop-color="#040407" />
    </radialGradient>

    <!-- CRT Horizontal Scanlines -->
    <pattern id="scanlines" width="512" height="12" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="512" height="6" fill="#000000" fill-opacity="0.35" />
      <rect x="0" y="6" width="512" height="6" fill="#ffffff" fill-opacity="0.03" />
    </pattern>

    <!-- Neon Glow Filters -->
    <filter id="pink-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feGaussianBlur stdDeviation="36" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="chroma-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Segment Styles -->
    <style>
      .seg-base {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .seg-red {
        stroke: #ff1a53;
        stroke-width: 26;
        opacity: 0.75;
      }
      .seg-blue {
        stroke: #00d8ff;
        stroke-width: 26;
        opacity: 0.65;
      }
      .seg-pink {
        stroke: #ff2a85;
        stroke-width: 22;
      }
      .seg-bright {
        stroke: #ff99cc;
        stroke-width: 12;
      }
      .seg-core {
        stroke: #ffffff;
        stroke-width: 5;
        opacity: 0.95;
      }
    </style>
  </defs>

  <!-- CRT Monitor Box Base -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bgGlow)" />
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#scanlines)" />

  <!-- Outer Synth Glow Border -->
  <rect x="20" y="20" width="472" height="472" rx="84" fill="none" stroke="#ff2a85" stroke-width="4" stroke-opacity="0.3" filter="url(#pink-glow)" />
  <rect x="20" y="20" width="472" height="472" rx="84" fill="none" stroke="#32ecff" stroke-width="2" stroke-opacity="0.2" />

  <!-- Layer 1: Red Chromatic Fringe (Shifted Left 4px) -->
  <g class="seg-base seg-red" transform="translate(-4, 0)" filter="url(#pink-glow)">
    <!-- Top Horizontal -->
    <line x1="132" y1="88" x2="240" y2="88" />
    <line x1="272" y1="88" x2="380" y2="88" />
    <!-- Bottom Horizontal -->
    <line x1="132" y1="424" x2="240" y2="424" />
    <line x1="272" y1="424" x2="380" y2="424" />
    <!-- Left Vertical -->
    <line x1="112" y1="108" x2="112" y2="240" />
    <line x1="112" y1="272" x2="112" y2="404" />
    <!-- Center Vertical -->
    <line x1="256" y1="108" x2="256" y2="236" />
    <line x1="256" y1="276" x2="256" y2="404" />
    <!-- Right Vertical -->
    <line x1="400" y1="108" x2="400" y2="240" />
    <line x1="400" y1="272" x2="400" y2="404" />
    <!-- Center Tick -->
    <line x1="230" y1="256" x2="282" y2="256" />
  </g>

  <!-- Layer 2: Blue Chromatic Fringe (Shifted Right 4px) -->
  <g class="seg-base seg-blue" transform="translate(4, 0)" filter="url(#chroma-blue)">
    <!-- Top Horizontal -->
    <line x1="132" y1="88" x2="240" y2="88" />
    <line x1="272" y1="88" x2="380" y2="88" />
    <!-- Bottom Horizontal -->
    <line x1="132" y1="424" x2="240" y2="424" />
    <line x1="272" y1="424" x2="380" y2="424" />
    <!-- Left Vertical -->
    <line x1="112" y1="108" x2="112" y2="240" />
    <line x1="112" y1="272" x2="112" y2="404" />
    <!-- Center Vertical -->
    <line x1="256" y1="108" x2="256" y2="236" />
    <line x1="256" y1="276" x2="256" y2="404" />
    <!-- Right Vertical -->
    <line x1="400" y1="108" x2="400" y2="240" />
    <line x1="400" y1="272" x2="400" y2="404" />
    <!-- Center Tick -->
    <line x1="230" y1="256" x2="282" y2="256" />
  </g>

  <!-- Layer 3: Hot Pink Main Glow -->
  <g class="seg-base seg-pink" filter="url(#pink-glow)">
    <!-- Top Horizontal -->
    <line x1="132" y1="88" x2="240" y2="88" />
    <line x1="272" y1="88" x2="380" y2="88" />
    <!-- Bottom Horizontal -->
    <line x1="132" y1="424" x2="240" y2="424" />
    <line x1="272" y1="424" x2="380" y2="424" />
    <!-- Left Vertical -->
    <line x1="112" y1="108" x2="112" y2="240" />
    <line x1="112" y1="272" x2="112" y2="404" />
    <!-- Center Vertical -->
    <line x1="256" y1="108" x2="256" y2="236" />
    <line x1="256" y1="276" x2="256" y2="404" />
    <!-- Right Vertical -->
    <line x1="400" y1="108" x2="400" y2="240" />
    <line x1="400" y1="272" x2="400" y2="404" />
    <!-- Center Tick -->
    <line x1="230" y1="256" x2="282" y2="256" />
  </g>

  <!-- Layer 4: Bright Highlight -->
  <g class="seg-base seg-bright">
    <line x1="132" y1="88" x2="240" y2="88" />
    <line x1="272" y1="88" x2="380" y2="88" />
    <line x1="132" y1="424" x2="240" y2="424" />
    <line x1="272" y1="424" x2="380" y2="424" />
    <line x1="112" y1="108" x2="112" y2="240" />
    <line x1="112" y1="272" x2="112" y2="404" />
    <line x1="256" y1="108" x2="256" y2="236" />
    <line x1="256" y1="276" x2="256" y2="404" />
    <line x1="400" y1="108" x2="400" y2="240" />
    <line x1="400" y1="272" x2="400" y2="404" />
    <line x1="230" y1="256" x2="282" y2="256" />
  </g>

  <!-- Layer 5: White Hot Center Core -->
  <g class="seg-base seg-core">
    <line x1="132" y1="88" x2="240" y2="88" />
    <line x1="272" y1="88" x2="380" y2="88" />
    <line x1="132" y1="424" x2="240" y2="424" />
    <line x1="272" y1="424" x2="380" y2="424" />
    <line x1="112" y1="108" x2="112" y2="240" />
    <line x1="112" y1="272" x2="112" y2="404" />
    <line x1="256" y1="108" x2="256" y2="236" />
    <line x1="256" y1="276" x2="256" y2="404" />
    <line x1="400" y1="108" x2="400" y2="240" />
    <line x1="400" y1="272" x2="400" y2="404" />
    <line x1="230" y1="256" x2="282" y2="256" />
  </g>
</svg>
